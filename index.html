<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Gran Tumba de Nazarick</title>

    <!-- Fuente Cinzel para el título principal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
    /* Fondo de pantalla principal con la imagen oficial */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url('IMG/Fondo.jpg') center center/cover no-repeat;
        opacity: 1;
        z-index: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
    }

    /* Fondo de partículas mágicas */
    #tsparticles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    body,
    .container,
    .titulo-principal {
        position: relative;
        z-index: 1;
    }

    body {
        background: linear-gradient(135deg, #0a0f1d 0%, #111827 100%);
        min-height: 100vh;
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        animation: fadeInBody 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        transition: background 0.6s ease, color 0.6s ease;
    }

    @keyframes fadeInBody {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .container {
        display: flex;
        gap: 3rem;
        flex-wrap: wrap;
        justify-content: center;
        padding: 30px 0 10px 0;
        flex: 1;
    }
    .intro-flex {
        flex-wrap: wrap;
        gap: 1.5rem;
        justify-content: center;
        align-items: center;
        width: 100%;
        box-sizing: border-box;
        margin-left: auto;
        margin-right: auto;
    }

    /* ===== TÍTULO PRINCIPAL - CINZEL DORADO ===== */
    .titulo-principal {
        text-align: center;
        font-family: 'Cinzel', 'Segoe UI', serif;
        font-size: 3rem;
        font-weight: 900;
        margin-top: 2.5rem;
        margin-bottom: 1.5rem;
        color: #ffd700;
        letter-spacing: 3px;
        position: relative;
        display: inline-block;
        animation: fadeInTitle 1.2s cubic-bezier(0.4, 0, 0.2, 1), tituloPulse 3.5s ease-in-out infinite 1.2s;
        text-shadow: 0 4px 20px rgba(15, 23, 42, 0.8), 0 0 25px rgba(255, 215, 0, 0.4);
    }

    .logo-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(0.5rem, 2vw, 1.5rem);
        width: min(94%, 1000px);
        margin: 0 auto 1.5rem;
        position: relative;
        z-index: 1;
        animation: fadeInUp 1.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .logo-row img {
        display: block;
        width: calc((100% - 2 * clamp(0.5rem, 2vw, 1.5rem)) / 3);
        height: 110px;
        object-fit: contain;
        filter: drop-shadow(0 0 14px rgba(160, 90, 255, 0.4));
    }
    @media (max-width: 600px) {
        .logo-row { width: 96%; }
        .logo-row img { height: 68px; }
    }

    .titulo-principal::after {
        content: 'Bienvenido a La Gran Tumba de Nazarick';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        letter-spacing: inherit;
        color: transparent;
        background: linear-gradient(120deg, transparent 0%, transparent 40%, rgba(255, 255, 255, 0.95) 50%, transparent 60%, transparent 100%);
        background-size: 250% 100%;
        background-position: 200% 0;
        -webkit-background-clip: text;
        background-clip: text;
        pointer-events: none;
        animation: brilloDeslizante 4s ease-in-out infinite 2s;
    }

    @keyframes brilloDeslizante {
        0%   { background-position: 200% 0; }
        40%  { background-position: -100% 0; }
        100% { background-position: -100% 0; }
    }

    @keyframes tituloPulse {
        0%, 100% { text-shadow: 0 4px 20px rgba(15, 23, 42, 0.8), 0 0 20px rgba(255, 215, 0, 0.4); }
        50% { text-shadow: 0 4px 25px rgba(15, 23, 42, 0.9), 0 0 35px rgba(255, 215, 0, 0.8), 0 0 15px rgba(233, 69, 96, 0.5); }
    }

    @keyframes fadeInTitle {
        from { opacity: 0; transform: scale(0.95) translateY(-30px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @media (max-width: 600px) {
        .titulo-principal { font-size: 1.9rem; letter-spacing: 1.5px; }
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(40px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== LISTADO DE ENLACES ===== */
    .social-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        width: 100%;
        max-width: 360px;
        margin: 0 auto 2.5rem auto;
        position: relative;
        z-index: 1;
        animation: fadeInUp 1.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .social-link {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 54px;
        box-sizing: border-box;
        padding: 0.75rem 1.25rem;
        border: 1.5px solid rgba(255, 215, 0, 0.45);
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.75);
        color: #ffd700;
        font-size: 1.05rem;
        font-weight: bold;
        letter-spacing: 0.5px;
        text-decoration: none;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }
    .social-link:hover {
        transform: translateY(-3px) scale(1.02);
        background: #ffd700;
        color: #0f172a;
        box-shadow: 0 10px 28px rgba(255, 215, 0, 0.35);
    }
    .platform-icon {
        width: 30px;
        height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 30px;
        margin-right: 12px;
        font-size: 1.55rem;
        line-height: 1;
    }
    .platform-name {
        flex: 1;
        text-align: center;
        margin-right: 42px;
    }
    .kick-icon {
        color: #53fc18;
        font-family: Arial, sans-serif;
        font-size: 1.45rem;
        font-weight: 900;
    }
    .sound-button {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 3;
        padding: 0.65rem 1rem;
        border: 1px solid rgba(255, 215, 0, 0.65);
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.9);
        color: #ffd700;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <div id="tsparticles"></div>

    <h1 class="titulo-principal">Bienvenido a La Gran Tumba de Nazarick</h1>
    <div class="logo-row" aria-label="Logos de BalaXberriuz, código de promotor y Metin2 Break">
        <img src="IMG/logo1.png" alt="BalaXberriuz">
        <img src="IMG/logo2.png" alt="Código de promotor: BALAMUCHACHO">
        <img src="IMG/logo3.png" alt="Metin2 Break">
    </div>

    <nav class="social-list" aria-label="Enlaces principales">
        <a class="social-link" href="https://www.tiktok.com/@balaxberriuz" target="_blank" rel="noopener noreferrer">
            <span class="platform-icon"><i class="fab fa-tiktok" aria-hidden="true"></i></span>
            <span class="platform-name">TikTok</span>
        </a>
        <a class="social-link" href="https://kick.com/balaxberriuz" target="_blank" rel="noopener noreferrer">
            <span class="platform-icon kick-icon" aria-hidden="true">K</span>
            <span class="platform-name">Kick</span>
        </a>
        <a class="social-link" href="https://www.youtube.com/@balaxberriuz" target="_blank" rel="noopener noreferrer">
            <span class="platform-icon"><i class="fab fa-youtube" aria-hidden="true"></i></span>
            <span class="platform-name">YouTube</span>
        </a>
        <a class="social-link" href="https://chat.whatsapp.com/JuU7noynddS7fy5c8Q3Nyg" target="_blank" rel="noopener noreferrer">
            <span class="platform-icon"><i class="fab fa-whatsapp" aria-hidden="true"></i></span>
            <span class="platform-name">WhatsApp</span>
        </a>
        <a class="social-link" href="https://discord.gg/uqA3dqYp2u" target="_blank" rel="noopener noreferrer">
            <span class="platform-icon"><i class="fab fa-discord" aria-hidden="true"></i></span>
            <span class="platform-name">Discord</span>
        </a>
        <a class="social-link" href="https://metin2break.com/download" target="_blank" rel="noopener noreferrer">
            <span class="platform-icon"><i class="fas fa-gamepad" aria-hidden="true"></i></span>
            <span class="platform-name">Metin2 Break</span>
        </a>
    </nav>

    <audio id="intro-audio" src="sonido/intro.mp3" autoplay preload="auto"></audio>
    <button class="sound-button" id="sound-button" type="button" hidden>Activar música</button>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.3.0/tsparticles.bundle.min.js"></script>
    <script>
        // Inicializar tsParticles para fondo de partículas mágicas
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('intro-audio');
            const soundButton = document.getElementById('sound-button');
            audio.volume = 0.25;

            audio.play().then(() => {
                soundButton.textContent = 'Detener música';
                soundButton.hidden = false;
            }).catch(() => {
                soundButton.textContent = 'Activar música';
                soundButton.hidden = false;
            });

            soundButton.addEventListener('click', () => {
                if (!audio.paused) {
                    audio.pause();
                    soundButton.textContent = 'Activar música';
                    return;
                }

                audio.play().then(() => {
                    soundButton.textContent = 'Detener música';
                    soundButton.hidden = false;
                }).catch((error) => {
                    console.error('No se pudo reproducir sonido/intro.mp3:', error);
                });
            });

            audio.addEventListener('ended', () => {
                soundButton.textContent = 'Activar música';
            });

            if (window.tsParticles) {
                tsParticles.load('tsparticles', {
                    background: { color: { value: 'transparent' } },
                    fpsLimit: 60,
                    particles: {
                        number: { value: 80, density: { enable: true, area: 800 } },
                        color: { value: '#ffd700' },
                        shape: { type: 'star' },
                        opacity: { value: 0.7 },
                        size: { value: 2.5, random: true },
                        move: { enable: true, speed: 0.7, direction: 'none', random: true, straight: false, outModes: 'out' }
                    },
                    interactivity: {
                        events: {
                            onHover: { enable: true, mode: 'repulse' },
                            onClick: { enable: true, mode: 'push' }
                        },
                        modes: {
                            repulse: { distance: 80, duration: 0.4 },
                            push: { quantity: 4 }
                        }
                    },
                    detectRetina: true
                });
            }

        });
    </script>
</body>
</html>
